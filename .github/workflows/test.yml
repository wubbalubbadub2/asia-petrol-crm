name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast unit tests: vitest + parser tests + TypeScript build.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  # Database tests: spin up Postgres, apply every migration in order, run
  # the SQL test suite. Catches trigger / RLS / constraint regressions
  # before they hit production.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Apply Supabase's minimal auth/storage scaffold that our migrations
      # reference (auth.users, auth.uid(), profiles FKs, etc.). We stub
      # these just enough to let the migrations run outside Supabase Cloud.
      - name: Stub Supabase auth schema
        run: |
          psql "$DATABASE_URL" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id UUID PRIMARY KEY,
            email TEXT
          );
          -- auth.uid() returns the current user id; in CI we default to NULL
          -- so triggers don't fail, and individual tests can override it.
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID
            LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          -- Row-level-security helpers referenced by later migrations.
          -- We stub them to always allow writes in CI; real policies run
          -- in production where is_writable_role() reads profiles.role.
          CREATE OR REPLACE FUNCTION public.is_writable_role() RETURNS BOOLEAN
            LANGUAGE sql STABLE AS $$ SELECT true $$;
          CREATE OR REPLACE FUNCTION public.is_admin() RETURNS BOOLEAN
            LANGUAGE sql STABLE AS $$ SELECT true $$;
          -- Роли Supabase. 00067 и далее раздают им GRANT'ы; без ролей
          -- миграция падает на «role "authenticated" does not exist».
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          -- Supabase Cloud раздаёт эти привилегии на новые таблицы сам;
          -- на голом Postgres их надо объявить, иначе service_role не
          -- получает прав на таблицы 1С-загрузчика (09_fiscal_views).
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL ON FUNCTIONS TO anon, authenticated, service_role;
          -- deal_activity (00016) добавляется в публикацию Realtime.
          CREATE PUBLICATION supabase_realtime;
          SQL

      - name: Apply all migrations in order
        run: |
          # Разовые правки ПРОДОВЫХ ДАННЫХ: они не несут схемы, зато
          # проверяют себя ассертами по конкретным строкам и на пустой
          # базе падают по определению. Править их нельзя — миграции
          # append-only и уже применены, — поэтому исключаем по имени.
          DATA_ONLY_MIGRATIONS="
          00103_renumber_kg_26_454_to_445.sql
          00152_dtkt_opening_balance_single_convention.sql
          "

          # Страховка от тихой потери схемы: если в исключённый файл
          # когда-нибудь добавят DDL, джоба падает, а не проходит мимо.
          for name in $DATA_ONLY_MIGRATIONS; do
            f="supabase/migrations/$name"
            if [ ! -f "$f" ]; then
              echo "::error::В списке DATA_ONLY_MIGRATIONS нет файла $name"
              exit 1
            fi
            if grep -inE '^[[:space:]]*(CREATE|ALTER|DROP)[[:space:]]+(TABLE|TYPE|INDEX|VIEW|FUNCTION|TRIGGER|POLICY|SCHEMA|PUBLICATION|SEQUENCE|MATERIALIZED)' "$f"; then
              echo "::error::$name содержит DDL и не может быть пропущен"
              exit 1
            fi
          done

          for f in supabase/migrations/*.sql; do
            # Сравнение построчно и целиком: подстрока одного имени
            # внутри другого не должна случайно исключить миграцию.
            if printf '%s\n' $DATA_ONLY_MIGRATIONS | grep -qxF "$(basename "$f")"; then
              echo "⏭ $f (правка данных, схемы не несёт)"
              continue
            fi
            echo "▶ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done

      - name: Run DB test suite
        run: ./supabase/tests/run.sh

  # End-to-end smoke test. Runs against a real Supabase project using
  # credentials stored as GitHub repo secrets. Skipped (as a pass) if the
  # secrets aren't configured — see e2e/smoke.spec.ts for the skip logic.
  e2e:
    runs-on: ubuntu-latest
    # Only run on main branch pushes; pull-requests from forks don't get
    # access to secrets so the spec would skip anyway.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
